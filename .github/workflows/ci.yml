name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
        include:
          # Python 3.9 is no longer in the tool cache of ubuntu-26.04.
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check every example
        shell: bash
        run: |
          python -m mycel check \
            examples/01-biped-walker.myc \
            examples/02-transformer-block.myc \
            examples/03-thermostat.myc \
            examples/04-hello-field.myc

      - name: CLI smoke test
        shell: bash
        run: |
          python -m mycel units "N*m"
          python -m mycel ast examples/04-hello-field.myc > /dev/null
          python -m mycel tokens examples/04-hello-field.myc > /dev/null

  spec:
    name: spec invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spec invariants (ASCII-only, no ';' '{' '}')
        run: python tools/check_spec.py

  package:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Verify the installed distribution
        shell: bash
        run: |
          mycel --version
          mycel check examples/04-hello-field.myc
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
